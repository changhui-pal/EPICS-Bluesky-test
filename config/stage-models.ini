# mres, travel limits, and vmax come from the official KOHZU specifications.
# default_velocity, base_velocity, and acceleration_time are conservative
# project commissioning defaults, not manufacturer-recommended values.
# Sensor information is reference metadata only; homing remains axis-specific.

