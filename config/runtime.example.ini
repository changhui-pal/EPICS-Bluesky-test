# Copy this file to runtime.ini and replace machine-specific values before use.
[controller]
# RFC 5737 documentation address; replace it with the ARIES controller address.
host = 192.0.2.10
port = 12321

[epics]
prefix = KOHZU:
bin = /usr/local/epics/base-7.0.7/bin/linux-x86_64
ca_addr_list = 127.0.0.1

[gui]
listen = 127.0.0.1
port = 8080
move_timeout = 180
home_timeout = 300

[python]
# Use the absolute path printed by `which python` in the installed environment.
executable = /path/to/kohzu-runtime/bin/python
